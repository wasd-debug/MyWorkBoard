services:
  mysql:
    image: mysql:8.0
    container_name: salary-mysql-dev
    restart: unless-stopped
    ports:
      - "${DEV_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: SalaryDevRoot@2026
      MYSQL_DATABASE: salary
      MYSQL_USER: salary
      MYSQL_PASSWORD: SalaryDevApp@2026
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-dev-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

volumes:
  mysql-dev-data:

