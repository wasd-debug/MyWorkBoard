server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # 任务/账本接口返回的是大体量 JSON（近万条任务时单页约 140KB），
    # 压缩后只剩 7%，是首屏耗时里最便宜的一笔收益。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # 不带这项时 nginx 不会压缩被代理的后端响应，gzip 等于没开。
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css
               text/plain text/xml application/xml image/svg+xml;

    # 前端静态页面（Vue 构建产物，SPA）
    root /usr/share/nginx/html;
    index index.html;

    # 构建产物文件名自带 content hash，内容变了文件名就变，可以放心长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 绝不能缓存：否则发版后浏览器继续用旧 index.html，
    # 它引用的还是旧 hash 的 JS，表现为"部署了但页面没变"。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ICS token 属于凭据，关闭该路径访问日志，避免明文 token 落盘。
    location ~ ^/api/v1/tasks/feed/[A-Za-z0-9_-]+\.ics$ {
        access_log off;
        proxy_pass http://salary-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 任务收件箱 SSE：必须关掉压缩与缓冲，否则事件会被 nginx 攒在缓冲区里，
    # 表现为「服务端已推送但前端要等一批才收到」。放在 /api/ 之前便于阅读，
    # 精确匹配本身优先级就高于前缀匹配。
    location = /api/v1/tasks/inbox/stream {
        gzip off;
        proxy_pass http://salary-backend:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 反向代理到后端容器（保留完整路径 /api/*）
    location /api/ {
        proxy_pass http://salary-backend:8080;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        client_body_timeout 900s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP Streamable HTTP（PAT 在后端逐请求认证）
    location = /mcp {
        proxy_pass http://salary-backend:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP OAuth 2.1 / PKCE discovery、注册和 token 端点
    location ^~ /.well-known/ {
        proxy_pass http://salary-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/oauth/(authorize|token|register|revoke)$ {
        proxy_pass http://salary-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /v3/api-docs {
        proxy_pass http://salary-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /swagger-ui/ {
        proxy_pass http://salary-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /swagger-ui.html {
        proxy_pass http://salary-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location = /api/health {
        proxy_pass http://salary-backend:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }
}
