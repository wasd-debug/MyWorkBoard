<title>真实时薪 · 加班追踪</title>
<script>
/* 主题预置（渲染前执行，防闪白/闪黑）：手动选择 > 系统偏好 */
(function(){
  var t = localStorage.getItem("st_theme") ||
    (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  document.documentElement.className = t;
})();
</script>
</head>
