<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f1">
<link rel="icon" href="data:,">
    <title>个人工作台</title>
<script>
(function(){
  var stored = localStorage.getItem('st_theme');
  var mobile = window.matchMedia && (matchMedia('(max-width: 640px)').matches || matchMedia('(pointer: coarse)').matches);
  var theme = stored === 'dark' || stored === 'light' ? stored : (mobile && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.className = theme;
})();
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
