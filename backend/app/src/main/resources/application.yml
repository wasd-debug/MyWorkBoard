server:
  port: ${PORT:8080}

spring:
  application:
    name: salary-tracker-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/salary?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:salary}
    password: ${DB_PASSWORD:salary123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 5 个连接在并发 10 时就会排队，超过 30s 抛 SQLTransientConnectionException。
      # 主机 2 核、MySQL max_connections=151，20 个连接对数据库压力可忽略。
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  sql:
    init:
      mode: never

  flyway:
    enabled: true
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:}
  mcp:
    enabled: ${APP_MCP_ENABLED:true}
    write-enabled: ${APP_MCP_WRITE_ENABLED:false}
    oauth-enabled: ${APP_MCP_OAUTH_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:salary-tracker-phase0-change-this-secret-at-least-32-bytes}
    access-ttl: ${JWT_ACCESS_TTL:7200}
    refresh-ttl: ${JWT_REFRESH_TTL:2592000}
  auth:
    # 请求期身份（用户+角色+权限）进程内缓存。这个 TTL 就是「改角色/禁用账号」最晚多久生效；
    # 需要立即生效时调用 AuthService.invalidateUser(userId)。设为 1 秒以下等于关闭缓存。
    user-cache-ttl-seconds: ${APP_AUTH_USER_CACHE_TTL_SECONDS:30}
  legacy-open: ${LEGACY_API_OPEN:false}
  legacy-admin-password: ${LEGACY_ADMIN_PASSWORD:}
  cookie-secure: ${COOKIE_SECURE:false}
  ai:
    endpoint: ${LLM_ENDPOINT:https://api.deepseek.com/chat/completions}
    model: ${LLM_MODEL:deepseek-flash}
    api-key: ${DEEPSEEK_API_KEY:${LLM_API_KEY:}}
    credential-key: ${AI_CREDENTIAL_KEY:}
    allow-private-network: ${AI_ALLOW_PRIVATE_NETWORK:false}

task:
  lunar-enabled: ${TASK_LUNAR_ENABLED:true}
