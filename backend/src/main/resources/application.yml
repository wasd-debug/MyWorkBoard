server:
  port: ${PORT:8080}

spring:
  application:
    name: salary-tracker-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/salary?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:salary}
    password: ${DB_PASSWORD:salary123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# 访问口令：设置后所有 /api/*（除健康检查）需带 X-Access-Code 请求头
app:
  access-code: ${ACCESS_CODE:}
