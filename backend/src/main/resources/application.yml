server:
  port: ${PORT:8080}

spring:
  application:
    name: salary-tracker-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/salary?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:salary}
    password: ${DB_PASSWORD:salary123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    secret: ${JWT_SECRET:salary-tracker-phase0-change-this-secret-at-least-32-bytes}
    access-ttl: ${JWT_ACCESS_TTL:900}
    refresh-ttl: ${JWT_REFRESH_TTL:2592000}
  legacy-open: ${LEGACY_API_OPEN:false}
  legacy-admin-password: ${LEGACY_ADMIN_PASSWORD:}
  cookie-secure: ${COOKIE_SECURE:false}
